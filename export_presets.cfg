; Godot 4 导出预设：Windows / Linux / macOS / Web
;
; 说明：
; - 本文件可安全提交到版本库（Godot 官方建议）。真正的机密项（签名口令、加密密钥）
;   由 Godot 存放在 .godot/export_credentials.cfg，已被 .gitignore 排除。
; - 导出产物统一输出到 build/<平台>/，该目录同样不入库。
; - 命令行导出（需已安装对应版本的导出模板）：
;     godot --headless --export-release "Windows Desktop" build/windows/2DBreakout.exe
;     godot --headless --export-release "Linux"          build/linux/2DBreakout.x86_64
;     godot --headless --export-release "macOS"          build/macos/2DBreakout.zip
;     godot --headless --export-release "Web"            build/web/index.html
;   目标目录必须预先存在，CI 会自行创建。
; - Web 预设关闭了线程支持（variant/thread_support=false），产物不需要
;   COOP/COEP 响应头即可运行，可直接丢到 GitHub Pages / itch.io 等静态托管。

